name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/Procura.sln

      - name: Build backend
        run: dotnet build backend/Procura.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test backend/Procura.sln --no-build --configuration Release --verbosity normal
